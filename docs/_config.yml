# ===== サイト基本情報（公開前に書き換える） =====
# サイト名は全ページ（ヘッダー・フッター・免責文・OG）でこの title から出る。
# ゲーム名・キャラ名はサイト名に入れない（白石のルール / Riot Legal 5章）。
title: "クラッチノート"
description: "日本の競技シーンを5分で把握する非公式ファンサイト。大会の形式、日本チームの道筋、移籍、パッチの数値変更を、公式発表を出典に表とまとめで整理します。"
author: "クラッチノート編集部"
brand_mark: "C"                 # ヘッダー左の角丸マークに入る1文字（自作マーク。公式ロゴ風にしない）
lang: ja
url: "https://bs-tk113.github.io"  # 例: https://<ユーザー名>.github.io または独自ドメイン
baseurl: ""                         # リポジトリ名を bs-tk113.github.io にしたのでルート直下（2026-10-28）
timezone: Asia/Tokyo

# ===== 計測・広告（空のままなら何も出力されない） =====
ga4_id: "G-DMBB4B3QG6"              # Google Analytics 4 の測定ID（G-XXXXXXX）
webmaster_verifications:   # Search Console の所有権確認（jekyll-seo-tag が meta タグを出力）
  google: "h1Rgqdbyb0MsgJ55LXo_sYL28iloxwxW-gKUW-FIkpo"
adsense_client: ""      # AdSense パブリッシャーID（ca-pub-XXXXXXXXXXXXXXXX）。入れると自動広告と ads.txt が有効
adsense_slots:
  article_top: ""       # 記事上の手動広告ユニットID（任意）
  article_bottom: ""    # 記事下の手動広告ユニットID（任意）
  home_infeed: ""       # トップ: 人気ランキングの下（スマホ）／左列の途中（PC）
  sidebar: ""           # トップ: PC は右列で追従、スマホは最下部
  hub_bottom: ""        # ハブ: 関連記事の上
  tool_bottom: ""       # ツール: FAQ の下（入力欄の近くには置かない）
  category_infeed: ""   # カテゴリページ: 記事一覧の途中

# ===== SNS 投稿の扱い =====
# X の投稿は公式埋め込みを使わず「X 投稿カード」（_includes/x-card.html: 表示名・@ハンドル・投稿日時・編集部の要約・リンク）で出す。
# "off" だけ実装している（白石: 要約＋リンクが基本。埋め込みは本人の公式発表に限り1記事2件まで → 当面は使わない）。
x_embed: "off"

# ===== 構成 =====
permalink: /:year/:month/:day/:title/
paginate: 10
paginate_path: "/page:num/"
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# ハブ（大会まとめ・一覧表）とツールはコレクションで管理する
#   docs/_hubs/<name>.md   -> /hub/<name>/
#   docs/_tools/<name>.html -> /tools/<name>/
collections:
  hubs:
    output: true
    permalink: /hub/:name/
  tools:
    output: true
    permalink: /tools/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: hubs
    values:
      layout: hub
  - scope:
      path: ""
      type: tools
    values:
      layout: tool
      category: tools
  - scope:
      path: "category"
    values:
      layout: category

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - assets/img/README.md
