---
layout: default
title: サイト内検索
description: 記事・まとめハブ・ツールをキーワードで探せます。
permalink: /search/
noindex: true
sitemap: false
---
<div class="page">
  {% include breadcrumb.html title=page.title %}
  <h1 class="page-title">サイト内検索</h1>
  <form class="search search--page" id="search-page-form" role="search" action="{{ '/search/' | relative_url }}" method="get" data-index="{{ '/search.json' | relative_url }}">
    <label class="sr-only" for="search-page-q">検索する言葉</label>
    <input id="search-page-q" name="q" type="search" placeholder="チーム名・エージェント名・用語で検索" autocomplete="off">
    <button type="submit">検索</button>
  </form>
  <p class="meta" id="search-status" aria-live="polite">検索には JavaScript を使います。動かない場合は<a href="{{ '/categories/' | relative_url }}">カテゴリ一覧</a>から探してください。</p>
  <ul class="search-results" id="search-results"></ul>
</div>
