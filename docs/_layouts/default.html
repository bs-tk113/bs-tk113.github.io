<!doctype html>
<html lang="{{ site.lang | default: 'ja' }}">
<head>
{% include head.html %}
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav>
        <a href="{{ '/categories/' | relative_url }}">カテゴリ</a>
        <a href="{{ '/about/' | relative_url }}">運営者情報</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <nav>
        <a href="{{ '/about/' | relative_url }}">運営者情報</a>
        <a href="{{ '/privacy/' | relative_url }}">プライバシーポリシー</a>
        <a href="{{ '/contact/' | relative_url }}">お問い合わせ</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </nav>
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.author }}</p>
    </div>
  </footer>
</body>
</html>
