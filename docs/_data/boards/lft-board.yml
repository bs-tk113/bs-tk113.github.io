# ボード（状態が変わる一覧）: LFT・FA ボードのデータ。ページは docs/_hubs/lft-board.md（board: lft-board）
# 実データは編集部が出典を確認してから入れる。items が空の間は表を出さず「まだ掲載していません」と出す。
#
# 1行の書き方:
#   - player: "活動名"                 # 本名・顔写真・アバターは載せない
#     prev_team: "前所属"              # なければ ""（「—」と出る）
#     role: "デュエリスト"             # 本人・チームが公表しているロール（推測で書かない）
#     declared: 2026-10-30             # 表明日（本人またはチームが発表した日）
#     terms: "条件の要約"              # 本人が書いた条件を編集部の言葉で短く（国内のみ・フルタイム希望 など）。元の言い回しを残さない
#     status: lft                      # lft（チーム募集中）/ joined（加入）/ retired（引退）/ hiatus（休止）/ returned（復帰）/ other
#     new_team: ""                     # joined のとき加入先
#     checked: 2026-10-30              # 最終確認日（行ごと）
#     sources:                         # 出典（本人またはチームの公式。1件以上）
#       - type: self                   # self（本人）/ team（チーム公式）/ organizer / official
#         label: "本人の X 投稿"
#         url: "https://..."
#         deleted: ""                  # 元の投稿の削除を確認した日。書くとリンクを外し「元の投稿は削除済み（日付確認）」
#
# 自動の安全装置（data/topics.md ルール3・4）:
#   - joined / retired は、self と team の両方の出典がそろうまで「確定」の表記にしない（「チーム公式の発表待ち」などと出る）
#   - 出典がすべて deleted になった行は表示しない

