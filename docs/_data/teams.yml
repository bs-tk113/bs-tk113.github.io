# チーム（キー: 英小文字）。ボード（所属（表明時）・加入先）・日程（matches.yml の teams）・いまの話題（now.yml の teams）でチーム名の横に出す。
# 表示は _includes/team.html（{% include team.html key="zeta" %}）。イベントハブのチームカード（配信者チーム）には使わない。
# ルール（data/topics.md「チームロゴ」）: ロゴは公式サイトから取得したものを改変せずに置く。表示はチーム名の横に小さく、チーム名の文字も必ず併記。
#   サムネイル・サイトロゴ・SNS画像・広告の近くには使わない。削除を求められたら24時間以内に外す（logo: を消せば文字バッジに戻る）。
# logo が無いチームは文字バッジ（short を color の背景に乗せる）。ロゴの形・マスコット・専用フォントを似せない。
# logo_bg: ロゴが透過で黒い等、濃い背景で見えないときに敷く背景色（ロゴ自体の色は変えない）。
# 取得元と取得日は data/team-logos.md に記録。

