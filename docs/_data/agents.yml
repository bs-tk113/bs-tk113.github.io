# エージェント（キー: 英名の小文字・記号なし。front matter の thumb_agent: に書く値。例 kayo）
# 2026-10-30 紅林: 全30体に拡充し role: を追加（公式サイトのエージェント一覧・各エージェントページで確認）。
# 並び順＝トップの「エージェント」一覧の並び（ロール順。デュエリスト → イニシエーター → コントローラー → センチネル）。
# 画像は docs/assets/img/agents/ に自前で置く（外部への直リンク禁止）。取得元・取得日は docs/assets/img/README.md。
# ファイルが無くても表示は崩れない（頭文字の枠のフォールバックが出る）。
# source は画像の取得元ページ（出典台帳。記事の出典欄にも使う）。
#
# role:     _data/roles.yml の key（duelist / initiator / controller / sentinel）。_includes/role-icon.html でアイコン＋ロール名になる
# icon:     96x96 JPEG（2〜4KB）。顔まわりを正方形に切り抜いたもの。カードのサムネ右下・ランキング・エージェント一覧
# portrait: トップのヒーロー（hero.yml で指定したものだけ使う）。
#           いまの jett-portrait.jpg は 616x822 の濃色背景（透過ではない）。四角く浮かないよう
#           style.css の .hero-agent で mask-image（左右と下を透明にフェード）をかけている。
#           portrait_w / portrait_h に画像の実寸を書く（レイアウトのずれ防止の width/height に使う）。
jett:
  name: ジェット
  role: duelist
  icon: /assets/img/agents/jett-icon.jpg
  portrait: /assets/img/agents/jett-portrait.jpg
  portrait_w: 616
