      kind: buff
      summary: "フラッシュポイントの弾の速さを 2000 → 2400（20% アップ）、フォールトラインの幅を 7.5m → 8m に"
    - target: agent
      key: harbor
      name: "ハーバー"
      kind: buff
      summary: "ストームサージは爆発までの時間 0.8秒 → 0.6秒、スロウ 0.6秒 → 2秒（視線が通っていなくても効くように）。レコニングのスロウも 0.6秒 → 2秒"
    - target: agent
      key: tejo
      name: "テホ"
      kind: adjust
      summary: "スペシャルデリバリーのスタンを 4秒 → 2.5秒 に短くし、爆発にダメージ（中心 35・最小 20）を追加。ステルスドローンは敵の特定を「瞬間的特定」から「完全特定」に変え、パルスの半径を 30m → 16m に"
    - target: agent
      key: vyse
      name: "ヴァイス"
      kind: buff
      summary: "スチールガーデンの半径を 26m → 28m に"
    - target: weapon
      key: bandit
      name: "バンディット"
      kind: new
      summary: "600 クレジットの新しいサイドアーム。マガジン8発・予備24発、リロード 1.5秒、構え 0.75秒"
    - target: map
      key: breeze
      name: "ブリーズ"
      kind: rework
      summary: "射線・開けた場所・防衛側の回り道を大きく作り直した。最初の2週間は、コンペティティブで負けたときの RR の減りが半分"
    - target: map
      key: breeze
      name: "ブリーズ"
      kind: pool_in
