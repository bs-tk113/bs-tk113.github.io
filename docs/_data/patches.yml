- version: "12.09"
  date: 2026-05-12
  url: "https://playvalorant.com/ja-jp/news/game-updates/valorant-patch-notes-12-09"
  headline: "ショットガン全体を「動きながら撃つと当たりにくい」方向に弱体化。ネオンも空中での速さと ULT 中の回復を絞った。"
  changes:
    - target: weapon
      key: shotguns
      name: "ショットガン全種"
      kind: nerf
      summary: "しゃがみ撃ちの精度ボーナスを 15% にそろえた（バッキー 10% → 15%、ジャッジ・ショーティー 25% → 15%）。拡散の増え方は、止まって撃つとき 0.075 → 0.75、歩き 0.09 → 1.5、走り 0.1 → 3.0。ロープ中の精度も大きく下げた"
    - target: weapon
      key: bucky
      name: "バッキー"
      kind: nerf
      summary: "0〜8m のペレット1発のダメージを 頭 40 → 34、胴 20 → 17、脚 17 → 14 に。最小拡散 2.6 → 3.0。移動中・ジャンプ中に撃ったときの拡散も増やした（ジャンプ撃ち 1.25 → 4.0 など）"
    - target: weapon
      key: judge
      name: "ジャッジ"
      kind: nerf
      summary: "最小拡散 2.25 → 2.5（PC 版。コンソール版は 12.11）。移動中・ジャンプ中に撃ったときの拡散も増やした（ジャンプ撃ち 2.25 → 4.0 など）"
    - target: weapon
      key: shorty
      name: "ショーティー"
      kind: nerf
      summary: "発射速度 3.33 → 3.0。移動中・ジャンプ中に撃ったときの拡散も増やした（ジャンプ撃ち 1.25 → 4.0 など）"
    - target: agent
      key: neon
      name: "ネオン"
      kind: nerf
      summary: "ハイギア中にジャンプしても空中で速くならないように。エネルギーがキルで回復するのは ULT 中だけに（自然回復はそのまま）"

