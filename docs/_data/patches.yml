# パッチ変更履歴（/hub/patch-history/ と /hub/agent-history/ の元データ）
# 2026-10-30 初版（柚木）。出典は playvalorant.com の公式パッチノート（日本語版）だけ。
#   数値は各パッチノートで確認（日本語版で読み、英語版で突き合わせ）。文章は編集部の言葉。公式の文は写さない。
#   他サイトの要約・表は見ない・写さない。確認できなかったパッチは載せない。
#
# 項目:
#   version  "13.09" のように文字列で
#   date     公式パッチノートの公開日（UTC 13:00〜14:00 公開。日本時間でも同じ日付）
#   url      公式パッチノート（日本語版）
#   headline このパッチの要点（自分の言葉で1文）
#   changes  競技に影響する変更だけ（エージェント・武器・マップ・マップローテーション）。
#            バグ修正の細目・見た目・台詞・期間限定モード・Premier の日程は載せない。該当なしは []。
#     target  agent / map / weapon / mode / system
#     key     agent は英名の小文字・記号なし（kay/o は kayo）。map は maps.yml のキー。weapon は英名の小文字
#     name    表示名（公式の日本語表記）
#     kind    buff（強化）/ nerf（弱体化）/ adjust（調整）/ new（新登場）/ rework（作り直し）/ bugfix（不具合修正）
#             pool_in（マッププール入り）/ pool_out（マッププールから外れる） ← マップローテーション用に追加
#     summary 数値は公式どおり（変更前 → 変更後）。文章は自分の言葉
#
# 新しいエージェント・マップのキー（agents.yml / maps.yml に未登録。デザイナーが追加予定）:
#   agent: hush, veto, miks, clove, waylay, deadlock, kayo, skye, breach, gekko, harbor, tejo, vyse, phoenix, yoru, iso
#   map:   summit, corrode, abyss, fracture
# 番号の飛び: 12.xx〜13.xx のうち 13.03・13.07 は公式のニュース一覧になく、URL も 404（2026-10-30 確認）。

- version: "13.09"
  date: 2026-10-27
  url: "https://playvalorant.com/ja-jp/news/game-updates/valorant-patch-notes-1309"
  headline: "新デュエリスト「ハッシュ」が登場。ウォーデンを扱いやすく強化し、クローヴの移動速度アップをほかのエージェントと同じ水準まで下げた。"
  changes:
    - target: agent
      key: hush
      name: "ハッシュ"
      kind: new
      summary: "新エージェント（デュエリスト）。アビリティーはテレキネシス（パッシブ）・ディスプレイスメント・フラッシュバルブ・フロー・サスペンション"
      # ロールは公式エージェントページ https://playvalorant.com/ja-jp/agents/hush/ で確認
    - target: agent
      key: clove
      name: "クローヴ"
      kind: nerf
      summary: "ピック・ミー・アップの移動速度ボーナスを 15% → 10% に。ノット・デッド・イェットで復活したクローヴを倒すと、倒した側に ULT ポイントとシグネチャーの回復が入るように"
    - target: weapon
      key: warden
      name: "ウォーデン"
      kind: buff
      summary: "2発目の弾丸誤差 0.25 → 0.2、3発目 0.6 → 0.5。最初の数発の縦の反動と、続けて撃ったときの拡散も軽くした"

- version: "13.08"
  date: 2026-10-13
  url: "https://playvalorant.com/ja-jp/news/game-updates/valorant-patch-notes-13-08"
  headline: "マッププールを2枚ずつ入れ替え（バインドとカロードが入り、アセントとスプリットが抜けた）。カロードは防衛側の回り道を短くする地形調整も。"
  changes:
    - target: map
      key: bind
      name: "バインド"
      kind: pool_in
      summary: "コンペティティブとデスマッチのマッププールに追加"
    - target: map
      key: corrode
      name: "カロード"
      kind: pool_in
      summary: "コンペティティブとデスマッチのマッププールに追加"
    - target: map
      key: corrode
      name: "カロード"
      kind: adjust
      summary: "防衛側が A・B サイトの奥へ回る道を短くした。ミッドのハーフウォールを金属製にして1メートル外側へ。A サイトの設置できる範囲も変更"
    - target: map
      key: ascent
      name: "アセント"
      kind: pool_out
      summary: "コンペティティブとデスマッチのマッププールから除外"
    - target: map
      key: split
      name: "スプリット"
      kind: pool_out
      summary: "コンペティティブとデスマッチのマッププールから除外"

