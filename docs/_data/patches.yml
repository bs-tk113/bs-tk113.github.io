- version: "13.01"
  date: 2026-07-14
  url: "https://playvalorant.com/ja-jp/news/game-updates/valorant-patch-notes-13-01"
  headline: "強さが目立っていたアウトローに、続けて撃つときの制限を付けた。ヨルのゲートクラッシュは 12.05 で短くした時間を一部戻した。"
  changes:
    - target: weapon
      key: outlaw
      name: "アウトロー"
      kind: nerf
      summary: "1発目を撃ったあとの次の弾について、射撃間隔 0.1秒 → 0.15秒、拡散 0 → 2.25、反動 0 → 4.0"
    - target: agent
      key: yoru
      name: "ヨル"
      kind: buff
      summary: "ゲートクラッシュのビーコンが残る時間を 15秒 → 20秒 に（12.05 で 30秒 → 15秒 に短くしていた）"
    - target: agent
      key: yoru
      name: "ヨル"
      kind: adjust
      summary: "フェイクアウトの分身が持つ武器を「いちばん強い武器」から「ヨルが最後に持っていた武器」に変更"
    - target: agent
      key: iso
      name: "アイソ"
      kind: buff
      summary: "ダブルタップを解除したあと、すぐに武器を構えられるように"

