  headline: "新サイドアーム「バンディット」とブリーズの作り直しで 2026 年が始まった。ブリーチ・ハーバー・ヴァイスを強化し、テホを調整。マッププールはブリーズが入りサンセットが抜けた。"
  changes:
    - target: agent
