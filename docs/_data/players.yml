# 選手名鑑のデータ（/hub/players/ の選手一覧、/hub/vct-pacific-japan-teams/ の所属選手）。表示は _includes/players.html と _includes/team-cards.html。
# 2026-10-30 初版（柚木）。チーム公式サイトの選手ページ・チーム公式の発表で確認できた人だけを載せる。
#
# 1人の書き方:
#   - id: sugarz3ro          # 英小文字・数字・ハイフン。ページ内アンカー（#pl-<id>）に使う。重複させない
#     name: "SugarZ3ro"      # 活動名（本名は載せない）
#     team: zeta             # _data/teams.yml のキー。無所属は ""
#     status: active         # active（在籍）/ sub（控え）/ coach（コーチ・アナリストなどのスタッフ）/ lft（本人がチーム募集を告知）
#                            #   / inactive（在籍しているがロスター外）/ left（退団の発表あり）
#     role: ""               # 公式（チームサイト・チームの発表・VCT 公式）に書いてあるときだけ。推測しない。不明は ""
#     role_keys: []          # duelist / initiator / controller / sentinel / flex / igl / coach / analyst（公式に書いてある範囲だけ）
#     country: ""            # 公式に書いてあるときだけ
#     links: {x: "", twitch: "", youtube: ""}   # チーム公式のプロフィール・発表に載っているリンクだけ
#     source: {title: "...", url: "https://..."} # この行の根拠（チーム公式の選手ページ、退団などは発表）
#     note: ""               # 任意。状態の補足（事実だけ）
#     checked: 2026-10-30    # 編集部が出典で確かめた日
#
# 載せないもの: 顔写真・アバター（RED）、使用エージェントなど公式に書いていない情報、本名、噂・報道だけの移籍。

