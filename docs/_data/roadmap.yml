# 公開予定のページ（空の状態を「何がいつ来るか」に変える。P1-a）
# 使われる場所:
#   - トップ／カテゴリ一覧のカテゴリカード: 記事が0件のとき「公開予定 n本」
#   - カテゴリページ・まとめハブ一覧・ツール一覧: 中身が0件のとき「準備中のページ」の一覧
# 項目:
#   title:    予定しているページの名前（記事タイトル案。確定でなくてよい）
#   category: categories.yml の slug
#   type:     hub（まとめハブ・一覧表）/ tool（ツール）/ post（記事）
#   status:   企画中 / 制作中 / 確認中（白石の校閲待ち）  ← 文字のまま表示する
#   doc:      公開後の URL（/hub/<name>/ や /tools/<name>/）。そのページが公開されると自動で一覧から消える。
#             記事（post）は URL に日付が入るので doc は書かず、公開したらこの行を消す。
# 日付は書かない（約束できない日付を読者に見せない）。

items:
