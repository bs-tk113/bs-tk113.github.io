# ヘッダー2段目の「話題タブ」とメニュー（ハンバーガー）の中身。
# tabs:
#   label: 表示名 / cat: 点の色（categories.yml の slug）
#   doc: 公開されたら飛ばしたいハブ・ツールの URL（/hub/<name>/ や /tools/<name>/）
#   fallback: doc がまだ公開されていない間の行き先（無ければタブ自体を出さない）
#   fallback_label: fallback に飛ぶ間の表示名（行き先と名前をずらさないため）
#   url: 固定の行き先（doc を使わない場合）
#   data: そのデータ（_data/<名前>.yml）の items が空のあいだはタブを出さない（いまの話題・大会カレンダー用）
# URL は baseurl なしで書く（テンプレート側で付ける）。
# 同じ fallback を2つのタブに書かない（同じページへのタブが並ぶと迷う）。
#   icon: 先頭のアイコン（_includes/icon.html の name。省略時は cat と同じ名前のカテゴリアイコン）
tabs:
  - label: いまの話題
    cat: default
    icon: now
    url: /now/
    data: now
  - label: 大会カレンダー
    cat: tournaments
    icon: schedule
    url: /schedule/
    data: matches
  - label: VCT 2027
    cat: tournaments
    doc: /hub/vct-2027/
    fallback: /category/tournaments/
    fallback_label: 大会ハブ
  # 選手名鑑: ハブを公開すると自動で出る（fallback なし＝未公開の間は出ない）
  - label: 選手名鑑
    cat: roster
    icon: player
    doc: /hub/players/
  - label: 用語集
    cat: glossary
    doc: /hub/glossary/
    fallback: /category/glossary/
    fallback_label: 用語・仕組み解説
  - label: オープン予選
    cat: tournaments
    doc: /hub/vct-2027-open-qualifier-japan/
  - label: Pacific 日本勢
    cat: tournaments
    doc: /hub/vct-pacific-japan-teams/
  # 配信者大会: fallback を外した。ハブ（/hub/streamer-tournaments-2026/）を公開したときだけ出る
  - label: 配信者大会
    cat: community
    doc: /hub/streamer-tournaments-2026/
  - label: 移籍トラッカー
    cat: roster
    doc: /hub/roster-tracker/
    fallback: /category/roster/
    fallback_label: ロスター・移籍
  # カテゴリ名「パッチ履歴」（/category/patch/）と区別するため、タブはハブの名前に合わせる
  - label: パッチ変更履歴
    cat: patch
    doc: /hub/patch-history/
    fallback: /category/patch/
    fallback_label: パッチ履歴
  - label: LFT ボード
    cat: roster
    doc: /hub/lft-board/
  # 週まとめ: 記事が0件の間は出さない。タブの仕組み（data: は _data の items しか見ない）では記事数で出し分けられないので、
  # 第1回を公開したら下の3行のコメントを外す（自動にするなら default.html 側に「カテゴリの記事数」の条件を足す＝水瀬さん）。
  # - label: 週まとめ
  #   cat: weekly
  #   url: /category/weekly/
  - label: 感度変換
    cat: tools
    doc: /tools/sensitivity/
  - label: eDPI 計算
    cat: tools
    doc: /tools/edpi/
    fallback: /tools/
    fallback_label: ツール

# メニュー（カテゴリ7つは categories.yml から自動で出る。ここはその下に並ぶ固定リンク。data: はタブと同じ）
menu:
  - label: いまの話題
    url: /now/
    data: now
  - label: 大会カレンダー
    url: /schedule/
    data: matches
  - label: まとめハブ一覧
    url: /hub/
  - label: ツール一覧
    url: /tools/
  - label: カテゴリ一覧
    url: /categories/
  - label: サイト内検索
    url: /search/
  - label: 運営者情報
    url: /about/
  - label: 出典ポリシー
    url: /about/#source-policy

# フッター「このサイトについて」
footer:
  - label: 運営者情報
    url: /about/
  - label: 出典ポリシー
    url: /about/#source-policy
  - label: プライバシーポリシー
    url: /privacy/
  - label: お問い合わせ
    url: /contact/
  - label: RSS
    url: /feed.xml
