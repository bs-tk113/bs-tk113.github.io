    title: "VCT Pacific 2027の形式が公開。日本のCups出場枠は3"
    url: /hub/vct-2027/
    summary: "VCT 公式が、Pacific 2027の仕組みを公開した。Stage 1・2は2つのCupsに置き換わり、KickoffとCupsは12チームのオフライン開催（Kickoffはバンコク、Cup 1はマニラ、Cup 2は東京）。Cupsの出場枠は地域ごとに、韓国と日本が各3、東南アジアが2、タイ・インドネシア・ベトナムが各1、LCQが1。"
    context: "Kickoffはパートナー8チームとオープン予選を勝ち抜いた4チームで行う。日本の3枠は、オープン予選（複数回挑戦できる）とプレイインを経た8チームの地域Playoffで争う。Mastersに進めなかったパートナーもプレイインから出る。"
