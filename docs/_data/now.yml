# 「いまの話題」タイムライン（/now/ とトップの「いまの話題」）。P1-b
# items が空の間は、トップの枠・ヘッダーのタブ・メニューのリンクを出さない。/now/ は noindex になる。
# 実データは編集部が出典を確認してから入れる（data/topics.md「選手・配信者・非公式大会」の8項目）。
#
# 1件の書き方（新しいものを上に書かなくてよい。表示は date の新しい順に並べ替える）:
#   - date: "2026-10-30T12:00:00+09:00"   # 出来事（投稿・発表）の日時。必ず +09:00 を付ける。日付だけなら "2026-10-30"
#     kind: roster                         # 話題の種類 = categories.yml の slug（tournaments / community / roster / patch / weekly / tools / glossary）
#                                          #   色の点と文字ラベル（カテゴリの short）で出る
#     title: "見出し（編集部の言葉で1行）"
#     summary: "要約1〜2行。事実だけ。元の言い回しを残さない・推測や評価を混ぜない"
#     context: "背景（任意。冗談・配信中のノリなど文脈が要るときに1行）"
#     checked: "2026-10-30 13:00"          # 編集部が出典を確認した日時（必須。表示する）
#     url: /hub/roster-tracker/            # サイト内の詳しいページ（任意。あれば「詳しく」リンク）
#     teams: [dfm]                         # 関係するチーム（任意）。_data/teams.yml のキー。見出しの下にバッジ＋チーム名で出る
#                                          #   話題の主役のチームだけ（名前が出てくるだけのチームは書かない）
#     sources:                             # 出典（必須。1件以上）
#       - type: team                       # official（Riot・VCT 公式）/ team（チーム公式）/ self（本人）/ organizer（主催者）
#         name: "表示名（活動名・チーム名）"
#         url: "https://..."
#         handle: "@xxxx"                  # X の投稿のときだけ書く → 「X 投稿カード」で表示（頭文字の丸・アイコン画像なし）
#         posted_at: "2026-10-30T11:58:00+09:00"   # X 投稿カードに出す投稿日時（任意）
#         deleted: ""                      # 元の投稿の削除を確認した日（例 "2026-11-01"）。書くとリンクを外し
#                                          #   「元の投稿は削除済み（11月1日確認）」と出す。魚拓リンクは書かない。
#
# 削除への追随（ルール4）: 出典がすべて deleted になった話題は、テンプレートが自動で表示しない（24時間以内に）。
#   公式発表で裏付けがあれば、その発表を sources に足すと「削除済み」の注記つきで残る。
# 書かないもの（ルール5・6）: 鍵アカウント・リプライ欄・掲示板の書き込み・炎上・私生活。スクショ・顔・アバター・ロゴ。

